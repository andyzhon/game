<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远征 · 原创武器图标</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1815;color:#e3eee2;font:14px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;padding:52px 40px}main{max-width:1150px;margin:auto}.eyebrow{font-size:11px;color:#c4b783;letter-spacing:.25em}h1{font-size:30px;font-weight:500;letter-spacing:.1em;margin:6px 0 8px}header p{color:#8ba69a;margin:0 0 32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}.card{background:linear-gradient(160deg,#1b332c,#11261f);border:1px solid #30493d;border-radius:16px;padding:24px 12px 20px;text-align:center}.hero{height:144px;display:grid;place-items:center;background:radial-gradient(ellipse,#33524266,transparent 65%)}.hero img{width:128px;height:128px;filter:drop-shadow(0 5px 4px #0005)}h2{font-size:15px;font-weight:500;margin:16px 0 0}.kind{color:#8caa9a;font-size:12px;margin:0}.small{display:flex;align-items:center;justify-content:center;gap:14px;margin:20px 0 8px;padding-top:20px;border-top:1px solid #314a3d}.small img{display:block}.id{font-size:10px;color:#7c998b;overflow-wrap:anywhere}.note{margin-top:26px;color:#90a99b;font-size:12px}.swatch{display:inline-block;width:10px;height:10px;background:#cad4c4;border-radius:50%;margin-right:6px}footer{color:#587565;font-size:11px;margin-top:32px}
</style></head><body><main><header><div class="eyebrow">EXPEDITION · WEAPON COLLECTION</div><h1>七刃 · 远征</h1><p>原创 64 × 64 透明矢量图标 · 从左下握柄指向右上刃尖</p></header><div class="grid" id="grid"></div><p class="note"><span class="swatch"></span>上方放大至 128px；下方依次为 64px 与 32px，便于检查游戏内的可辨识度。</p><footer>所有图形均以 SVG 路径原创绘制，无字体依赖、无外部图片或第三方标识。</footer></main><script>
const items=[['traveler_sword','旅人的短剑','朴素钢刃'],['bloodthorn','赤棘短刃','赤色弯刃'],['thunderblade','雷鸣长刃','折锋雷电剑'],['frostlance','霜牙长枪','冰蓝长枪'],['runic_axe','破甲战斧','符文战斧'],['moonblade','月蚀法刃','月牙法刃'],['dawnblade','星陨巨剑','金色宽巨剑']];
document.getElementById('grid').innerHTML=items.map(([id,name,kind])=>`<article class="card"><div class="hero"><img src="${id}.svg" alt="${name}"></div><h2>${name}</h2><p class="kind">${kind}</p><div class="small"><img src="${id}.svg" width="64" height="64" alt=""><img src="${id}.svg" width="32" height="32" alt=""></div><span class="id">${id}</span></article>`).join('');
</script></body></html>
